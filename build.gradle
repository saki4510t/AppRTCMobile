// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
	// android
	id 'com.android.application' version '8.9.3' apply false
	id 'com.android.library' version '8.9.3' apply false
	// kotlin
	id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
	id 'org.jetbrains.kotlin.kapt' version '1.9.24' apply false
	id 'org.jetbrains.dokka' version '1.9.20' apply false
}

tasks.register('clean', Delete) {
	delete rootProject.buildDir
}

ext {
	javaSourceCompatibility = JavaVersion.VERSION_1_8
	javaTargetCompatibility = JavaVersion.VERSION_1_8

	versionCompiler = 35
	versionTarget = 27

	junitVersion = '4.13.2'
	androidXTestRunnerVersion = '1.1.5'
	androidXEspressoVersion = '3.5.1'

	androidXAppCompat = '1.6.0'
	androidXLegacyV4 = '1.0.0'
	androidXExif = '1.3.3'
	androidXLifecycle = '2.3.1'
	androidXMultiDex = '2.0.1'
	androidXMaterial = '1.7.0'
	androidXRecyclerview = '1.2.1'
	androidXPreference = '1.2.0'
	androidXConstraint = '2.1.4'
	androidXSwiperefreshlayout = '1.1.0'

	androidXCore = '1.8.0'
	androidXLifecycleKtx = '2.5.1'
	androidXFragmentKtx = '1.5.5'

	commonLibVersion= '9.14.4'
	libwebrtcVersion = '2025-08-29T04_03_50'

	versionCodeNum = 45
	versionNameString = '1.7.2'
	webrtcAarVersionString = '2.4.0'
}
